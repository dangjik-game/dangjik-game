name: 안드로이드 앱 빌드
on:
  push:
    branches: [ android ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.SIGN_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: 안드로이드 SDK 준비
        run: |
          echo "::notice::기존 ANDROID_HOME=${ANDROID_HOME:-없음} / $(ls ${ANDROID_HOME:-/nonexistent} 2>/dev/null | tr '\n' ' ')"
          if [ -z "$ANDROID_HOME" ] || [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            export ANDROID_HOME=$HOME/android-sdk; mkdir -p $ANDROID_HOME/cmdline-tools
            curl -sSLo /tmp/t.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip || { echo "::error::SDK 도구 다운로드 실패"; exit 1; }
            unzip -q /tmp/t.zip -d $ANDROID_HOME/cmdline-tools && mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV; echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - run: npm ci
      - run: npx cap sync android
      - name: 시험용 APK (휴대폰에 바로 설치)
        working-directory: android
        env: { APP_VERSION_CODE: "${{ github.run_number }}" }
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log || { grep -E "error|What went wrong|FAILURE|Could not|>" build.log | tail -25 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - uses: actions/upload-artifact@v4
        with: { name: 시험용-apk, path: android/app/build/outputs/apk/debug/*.apk }
      - name: 출시용 AAB (서명 키가 등록돼 있을 때만)
        if: env.HAS_KEY == 'true'
        working-directory: android
        env:
          APP_VERSION_CODE: "${{ github.run_number }}"
          SIGN_STORE_PASSWORD: ${{ secrets.SIGN_STORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.SIGN_KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/upload.jks
          SIGN_STORE_FILE=$RUNNER_TEMP/upload.jks ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with: { name: 출시용-aab, path: android/app/build/outputs/bundle/release/*.aab }
