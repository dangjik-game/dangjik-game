name: 안드로이드 앱 빌드
on:
  push:
    branches: [ android ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.SIGN_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npx cap sync android
      - name: 시험용 APK (휴대폰에 바로 설치)
        working-directory: android
        env: { APP_VERSION_CODE: "${{ github.run_number }}" }
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log || { grep -E "error|What went wrong|FAILURE|Could not|>" build.log | tail -25 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - uses: actions/upload-artifact@v4
        with: { name: 시험용-apk, path: android/app/build/outputs/apk/debug/*.apk }
      - name: 출시용 AAB (서명 키가 등록돼 있을 때만)
        if: env.HAS_KEY == 'true'
        working-directory: android
        env:
          APP_VERSION_CODE: "${{ github.run_number }}"
          SIGN_STORE_PASSWORD: ${{ secrets.SIGN_STORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.SIGN_KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/upload.jks
          SIGN_STORE_FILE=$RUNNER_TEMP/upload.jks ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with: { name: 출시용-aab, path: android/app/build/outputs/bundle/release/*.aab }
